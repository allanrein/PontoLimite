<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ponto Limite - Lembrete de Ponto</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>
  <!--<body
    class="bg-slate-100 min-h-screen flex items-center justify-center p-4 font-sans antialiased text-slate-800"
  >-->
  <body
    class="bg-slate-100 min-h-screen flex flex-col justify-between items-center p-4"
  >
    <!--<main
      class="bg-white w-full max-w-md rounded-3xl shadow-xl p-6 border border-slate-100 space-y-6"
    >-->
    <main class="w-full max-w-md bg-white rounded-2xl shadow-lg p-6 my-auto">
      <!-- Cabeçalho -->
      <header class="text-center space-y-1 mb-2">
        <div
          class="inline-flex items-center justify-center w-12 h-12 bg-blue-100 text-blue-600 rounded-2xl mb-1"
        >
          <i data-lucide="clock" class="w-6 h-6"></i>
        </div>
        <h1 class="text-2xl font-bold text-slate-900 tracking-tight">
          Ponto Limite
        </h1>
        <p class="text-xs text-slate-500">
          Evite a 10ª hora ilegal e advertências
        </p>
      </header>

      <!-- Botão de Ação Rápida -->
      <button
        onclick="marcarEntradaAgora()"
        class="w-full bg-blue-600 hover:bg-blue-700 active:scale-[0.98] text-white font-semibold py-3.5 px-4 rounded-2xl shadow-lg shadow-blue-500/25 transition-all flex items-center justify-center gap-2"
      >
        <i data-lucide="map-pin" class="w-5 h-5"></i>
        <span>Registrei a entrada AGORA</span>
      </button>

      <!-- Divisor -->
      <div class="relative flex items-center justify-center my-6">
        <div class="border-t border-slate-200 w-full"></div>
        <span
          class="bg-white px-3 text-xs font-medium text-slate-400 uppercase tracking-wider absolute"
          >ou ajuste</span
        >
      </div>

      <!-- Formulário -->
      <div class="space-y-4">
        <!-- Seleção de Turno -->
        <div>
          <label
            for="turno"
            class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5"
          >
            Turno / Carga Horária
          </label>
          <div class="relative">
            <select
              id="turno"
              onchange="calcularSaida()"
              class="w-full appearance-none bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm font-medium text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all pr-10"
            >
              <!--<option value="8.0">Horário ADM (8h + 1h almoço)</option>-->
              <option value="8.8">Turno ADM (8h48)</option>
              <option value="7.33333333">Turno (7h20min)</option>
            </select>
            <div
              class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-slate-400"
            >
              <i data-lucide="chevron-down" class="w-4 h-4"></i>
            </div>
          </div>
        </div>

        <!-- Horário de Entrada -->
        <div>
          <label
            for="horaEntrada"
            class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5"
          >
            Horário de Entrada
          </label>
          <input
            type="time"
            id="horaEntrada"
            onchange="calcularSaida()"
            class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm font-medium text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all mb-4"
          />
        </div>

        <!-- Tempo de Almoço -->
        <!--<div id="grupoAlmoco">
          <label
            for="duracaoAlmoco"
            class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5"
          >
            Tempo de Almoço (minutos)
          </label>
          <input
            type="number"
            id="duracaoAlmoco"
            value="60"
            min="0"
            step="5"
            onchange="calcularSaida()"
            class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm font-medium text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
          />
        </div>-->
      </div>

      <!-- Bloco de Resultados -->
      <div
        id="resultadoBox"
        class="hidden space-y-3 transition-all duration-300 ease-in-out"
      >
        <!-- Saída Normal -->
        <div
          class="bg-blue-50 border border-blue-100 rounded-2xl p-4 text-center"
        >
          <span
            class="text-xs font-semibold text-blue-600 uppercase tracking-wider"
            >Saída Normal (Fim da Jornada)</span
          >
          <div
            id="horaSaida"
            class="text-3xl font-extrabold text-blue-900 tracking-tight mt-1"
          >
            --:--
          </div>
        </div>

        <!-- Saída Máxima Permitida (Alerta de Advertência) -->
        <div
          class="bg-red-50 border border-red-200 rounded-2xl p-4 text-center space-y-1"
        >
          <span
            class="text-xs font-semibold text-red-600 uppercase tracking-wider flex items-center justify-center gap-1"
          >
            <i data-lucide="shield-alert" class="w-4 h-4"></i>
            Limite Máximo de Saída
          </span>
          <div
            id="horaSaidaMaxima"
            class="text-3xl font-extrabold text-red-700 tracking-tight"
          >
            --:--
          </div>
          <p class="text-[11px] text-red-600 font-medium">
            Passou de 1 minuto deste horário = Advertência / Ilegalidade
          </p>
        </div>

        <!-- Botão para Notificação -->
        <button
          onclick="agendarAlerta()"
          class="w-full bg-emerald-600 hover:bg-emerald-700 active:scale-[0.98] text-white font-semibold py-3 px-4 rounded-xl shadow-md shadow-emerald-600/20 transition-all flex items-center justify-center gap-2 text-sm"
        >
          <i data-lucide="bell" class="w-4 h-4"></i>
          <span>Notificar 10 min antes do limite</span>
        </button>
      </div>
    </main>

    <script>
      // Inicializar Ícones Lucide
      lucide.createIcons();

      function obterHoraAtual() {
        const agora = new Date();
        return `${String(agora.getHours()).padStart(2, "0")}:${String(agora.getMinutes()).padStart(2, "0")}`;
      }

      function marcarEntradaAgora() {
        document.getElementById("horaEntrada").value = obterHoraAtual();
        calcularSaida();
      }

      function converterParaMinutos(horaStr) {
        const [hh, mm] = horaStr.split(":").map(Number);
        return hh * 60 + mm;
      }

      function formatarMinutosParaHora(minutosTotais) {
        const minTratados = minutosTotais % (24 * 60);
        const h = String(Math.floor(minTratados / 60)).padStart(2, "0");
        const m = String(minTratados % 60).padStart(2, "0");
        return `${h}:${m}`;
      }

      function calcularSaida() {
        const horaEntradaVal = document.getElementById("horaEntrada").value;
        if (!horaEntradaVal) return;

        const turnoHoras = parseFloat(document.getElementById("turno").value);
        const grupoAlmoco = document.getElementById("grupoAlmoco");

        let minutosAlmoco = 60;

        const minutosExtras = turnoHoras === 8.8 ? 72 : 120;

        const minutosEntrada = converterParaMinutos(horaEntradaVal);
        const minutosTrabalhoNormal = Math.round(turnoHoras * 60);

        // 1. Saída Normal (Entrada + Carga Horária + Almoço)
        const minutosSaidaNormal =
          minutosEntrada + minutosTrabalhoNormal + minutosAlmoco;
        document.getElementById("horaSaida").innerText =
          formatarMinutosParaHora(minutosSaidaNormal);

        // 2. Saída Máxima (Limite de +2 Horas Extras exatas)
        const minutosSaidaMaxima = minutosSaidaNormal + minutosExtras;
        document.getElementById("horaSaidaMaxima").innerText =
          formatarMinutosParaHora(minutosSaidaMaxima);

        document.getElementById("resultadoBox").classList.remove("hidden");
      }

      function agendarAlerta() {
        if ("Notification" in window) {
          Notification.requestPermission().then((permission) => {
            if (permission === "granted") {
              alert(
                "Alerta ativado! Você receberá uma notificação antes de atingir o limite.",
              );
            } else {
              alert(
                "Por favor, permita as notificações no navegador do celular para receber os alertas.",
              );
            }
          });
        } else {
          alert("Seu navegador não suporta notificações de sistema.");
        }
      }
    </script>
    <!-- RODAPÉ CORRIGIDO -->
    <footer class="w-full text-center py-4 text-xs text-slate-500">
      <p>
        Desenvolvido por
        <a
          href="https://github.com/allanrein"
          target="_blank"
          rel="noopener noreferrer"
          class="font-semibold text-slate-700 hover:text-blue-600 transition-colors underline decoration-slate-300 underline-offset-2"
        >
          Allan Rein
        </a>
      </p>
    </footer>
  </body>
</html>
